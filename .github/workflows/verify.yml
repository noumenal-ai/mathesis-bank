# Stet — re-derive the record.
#
# This repository holds the record and the program that checks it. This workflow is that program,
# run on a clean machine on every push and once a week, so the claim "every record re-derives from
# its own evidence" is not something you have to take on trust or run yourself first.
#
# It builds nothing else. There is no site to render and nothing to deploy — those moved out when
# the repository was reduced to the record and its verifier. If you are looking for the thing that
# publishes the website, it is not here, and that is the point.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    # Weekly. A record that stopped re-deriving would otherwise only surface when someone
    # happened to look, which for an archive could be years.
    - cron: '0 6 * * 1'

# Read-only. This workflow publishes nothing, so it needs nothing.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The one dependency, and only for the schema leg. bin/mathesis fails closed without it
      # rather than skipping that check.
      - run: pip install jsonschema

      # ── the verifier itself ──────────────────────────────────────────────────────────────
      # use-github-cache is off deliberately: a cached .lake once restored a STALE exe, so a
      # change to the gate silently ran the old binary and nothing noticed. A clean build each
      # run is ~2 minutes and correct.
      - name: Build the gate
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: backend-gate
          use-github-cache: false
          test: false
          lint: false

      # lean-action runs a bare `lake build` (default targets). The exe is a default_target, but
      # ask for it by name so its presence does not depend on lean-action's build semantics.
      - name: Build the gate executable
        working-directory: backend-gate
        run: lake build mathesis-adjudicate

      # Exported to $GITHUB_ENV rather than set on one step, because BOTH the built-ins
      # regression and `bin/mathesis verify` need it. Reducing this workflow set it on the verify
      # step alone, and the regression test — which requires it — died on its first line with
      # "MATHESIS_ADJUDICATE: the gate binary". The `test -x` is the point of the step: a path
      # that does not exist would otherwise surface much later, as a verifier that checked
      # nothing.
      - name: Locate the gate binary
        run: |
          BIN="$GITHUB_WORKSPACE/backend-gate/.lake/build/bin/mathesis-adjudicate"
          test -x "$BIN" || { echo "FATAL: gate exe not built at $BIN"; ls -R backend-gate/.lake/build/bin || true; exit 1; }
          echo "MATHESIS_ADJUDICATE=$BIN" >> "$GITHUB_ENV"

      # The exe calls Lean.findSysroot at startup and shells out to `lean`. lean-action pins the
      # toolchain per project, not globally, so invoking the exe from the repo root otherwise
      # hits "no default toolchain configured".
      - name: Make the toolchain resolvable from the repo root
        working-directory: backend-gate
        run: |
          elan default "$(tr -d '[:space:]' < lean-toolchain)"
          echo "LEAN_SYSROOT=$(lean --print-prefix)" >> "$GITHUB_ENV"

      # The fixtures export their own candidates, so they need lean4export's EXECUTABLE; the gate
      # build compiles only its Export library.
      - name: Build lean4export, for the gate's regression tests
        run: |
          PKG="$GITHUB_WORKSPACE/backend-gate/.lake/packages/lean4export"
          TC="$(tr -d '[:space:]' < backend-gate/lean-toolchain)"
          ( cd "$PKG" && elan run "$TC" lake build ) || { echo "FATAL: lean4export build failed"; exit 1; }
          BIN="$(find "$PKG/.lake" -type f -name lean4export -perm -u+x | head -n1)"
          test -n "$BIN" || { echo "FATAL: lean4export exe not found"; exit 1; }
          # LEAN4EXPORT, which is the name ci/test_gate_builtins.sh reads. Spelled
          # MATHESIS_LEAN4EXPORT here at first, which set a variable nothing looks at.
          echo "LEAN4EXPORT=$BIN" >> "$GITHUB_ENV"

      # Does the verifier still catch the attack it was written for? A candidate redefining
      # `Nat.gcd` once proved `2 + 2 = 5` and was ADMITTED, with the trusted export loaded. This
      # runs before the record is checked, because a verifier that has stopped checking would
      # otherwise report 32 clean re-derivations.
      - name: The gate still catches a forged kernel built-in
        run: bash ci/test_gate_builtins.sh

      # A vacuous statement wearing a name. `theorem rh : Disguised` where `Disguised := True`
      # passed as clean, because the flag tested the conclusion exactly as written — so the one
      # check that routes a possibly mis-claimed result to a human could be stepped around with
      # a definition. Runs here, beside the built-ins regression, for the same reason: both are
      # about the gate still meaning what it says before the record is re-derived against it.
      - name: The gate still flags a vacuous statement
        run: bash ci/test_gate_triviality.sh

      # The other half of "the record says what was proved". The two above keep the gate
      # meaning what it says about the TERM; this one is about the WORDS. Every check in the
      # re-derivation leg — verdict, replay, target presence, triviality, axioms — is a
      # statement about the term, so a record could publish any rendering it liked and pass.
      # Runs here for the same reason as its neighbours: before the record is re-derived
      # against a verifier that might have stopped checking.
      - name: A record publishes the statement the kernel checked
        run: python3 ci/test_statement_binding.py

      # A blob that does not arrive must say why. The old message said the bank was missing the
      # evidence for a record, which is a claim about the corpus that a failed download is in no
      # position to make.
      - name: A missing export says why it is missing
        run: python3 ci/test_fetch_reporting.py

      # Withdrawing a record without deleting it. Deleting one fails the crosslinks leg, so the
      # only coherent withdrawal is a mark — and a mark nothing reports is a record that still
      # reads as standing.
      - name: A withdrawn record is marked, not deleted
        run: python3 ci/test_retraction.py

      # The depositor's title and words reach the record. They are assertions, re-derived by
      # nothing, so all this holds is their shape: optional, one bounded string each.
      - name: A claim can carry its title and words
        run: python3 ci/test_claim_words.py

      # ── the record ───────────────────────────────────────────────────────────────────────
      - name: Re-derive every record
        env:
          BANK_EXPORT_STORE: gh:${{ github.repository }}@bank-exports-v1
          GH_TOKEN: ${{ github.token }}
        run: bin/mathesis verify
