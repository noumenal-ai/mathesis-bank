# ---------------------------------------------------------------------------------------------
# Tell the person whose record this was.
#
# A deposit takes minutes of real compute and then waits on a human to merge it. Until now the
# depositor learned that had happened by going and looking. Nothing told them.
#
# WHY A COMMENT AND NOT AN EMAIL
#
# Stet holds no email address for anybody and cannot obtain one: sign-in requests `read:user`,
# for which GitHub returns no address. Keeping addresses would mean a table of them, a consent
# screen change for everyone who only wants to read, and one more thing to leak. GitHub already
# mails people about mentions, through notification settings they control. What this chooses is
# the content, not the envelope.
#
# `pull_request_target`, not `pull_request`: a record may be proposed from a fork, and a
# fork-triggered `pull_request` gets a read-only token that cannot comment. Nothing here checks
# out or runs any code from the pull request — it reads the body and posts a comment — so the
# usual hazard of that trigger does not arise.
#
# WHY IT WAITS FOR THE PAGE
#
# Merging puts the record in the bank. It does not put it on stet.world: the site is rebuilt from
# the bank by mathesis-backend's publish-site, which runs when the deployment settles a merge (at
# :07 and :37) and on its own schedule. This used to comment the moment the pull request merged,
# saying the record "is live now" and linking a page that answered 404 for up to half an hour, or
# six hours before settling ran on a schedule that worked. So it asks the page first, once a
# minute, and says "live now" only when the page answers. If the page has not answered within
# fifty minutes it says what is true instead: merged, and where the page will be. A public
# repository's runner minutes cost nothing, so waiting is cheaper than being wrong.
# ---------------------------------------------------------------------------------------------
name: merged

on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  tell:
    # Closed is not merged. A pull request somebody closed unmerged is a decision the depositor
    # may well want to hear about, but not in these words and not from this.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # The wait below is bounded at fifty minutes; this bounds everything else.
    timeout-minutes: 60
    steps:
      - name: Tell the depositor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys, time, urllib.request

          # The marker `publish.py` writes into every body it opens. Read as a marker rather than
          # parsed out of the prose, so rewording the pull request cannot silently stop this —
          # and absent on anything a person opened by hand, which is exactly when to say nothing.
          m = re.search(r"<!-- stet-record (.*?) -->", os.environ.get("PR_BODY") or "")
          if not m:
              print("no stet-record marker; this was not opened by the publisher")
              sys.exit(0)
          f = dict(p.split("=", 1) for p in m.group(1).split() if "=" in p)
          login, claim = f.get("login", ""), f.get("claim", "")
          # Both go into a mention and a URL, so both are held to their shapes rather than
          # trusted for having come from the publisher.
          if not (re.fullmatch(r"MTH\.C-\d{4}-\d{4}", claim)
                  and re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})", login)):
              print(f"marker is incomplete or malformed: {f}")
              sys.exit(0)
          page = f"https://stet.world/a/{claim}/"

          def answers() -> bool:
              # A query nobody else sends, so no cache between here and the bucket can answer
              # with a 404 it kept from before the page existed.
              req = urllib.request.Request(
                  f"{page}?merged={int(time.time())}", method="HEAD",
                  headers={"User-Agent": "stet-bank merged.yml"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status == 200
              except Exception:
                  return False

          deadline = time.monotonic() + 50 * 60
          live = answers()
          while not live and time.monotonic() < deadline:
              time.sleep(60)
              live = answers()
          print(f"{page} {'answers' if live else 'did not answer within fifty minutes'}",
                flush=True)

          if live:
              body = (
                  f"@{login} — this is published.\n\n"
                  f"Your record is **`{claim}`**, and it is live now:\n\n"
                  f"{page}\n\n"
                  "The statement, its argument graph, the axioms it reaches and the frozen export "
                  "are all on that page. The accession is permanent: it is what to cite, and it "
                  "will not change.\n"
              )
          else:
              body = (
                  f"@{login} — this is merged into the record.\n\n"
                  f"Your record is **`{claim}`**. Its page will be here once the site next "
                  f"publishes, which has not happened yet:\n\n"
                  f"{page}\n\n"
                  "The accession is permanent: it is what to cite, and it will not change.\n"
              )
          subprocess.run(
              ["gh", "pr", "comment", os.environ["NUMBER"],
               "--repo", os.environ["REPO"], "--body", body],
              check=True,
          )
          PY
