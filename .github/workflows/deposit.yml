# Mathesis — external-deposit gate for form-raised deposit PRs.
#
# A deposit PR touches deposits/<slug>/submission.lean (the single-file format
# the site form emits). This workflow runs the per-deposit gate on every
# changed deposit and posts ONE PR comment with the combined verdict, failing
# the job if any deposit is rejected or blocked.
#
# ── TRUST MODEL: this runs UNTRUSTED code, so read carefully ──────────────────
# The deposit's submission.lean is elaborated by `lean`, and Lean elaboration
# can run ARBITRARY IO at build time (#eval, elaboration macros, `initialize`).
# The deposit came from a fork, so this build is UNTRUSTED. Isolation:
#
#   * We use the `pull_request` event (NOT pull_request_target). On a fork PR,
#     `pull_request` gives the job a READ-ONLY GITHUB_TOKEN and NO access to
#     repo secrets. `permissions: contents: read` pins that down further. So a
#     malicious build cannot push, cannot read a secret (there are none in
#     scope), cannot mutate the repo. This is the PRIMARY isolation and it is
#     GitHub-enforced.
#   * pull_request_target is deliberately AVOIDED: it would run with a
#     read/write token in the BASE repo's context while checking out fork code
#     — exactly the combination that turns an untrusted build into repo
#     compromise. We never want that here.
#   * ci/gate_deposit.sh additionally wraps the `lean` build in landrun
#     (Landlock FS confinement) when available; network-egress confinement is a
#     documented follow-on (see that script's header).
#
# Admission is NOT trusted from the build. The build only produces a CANDIDATE
# export that the trusted Lean kernel (mathesis-adjudicate) RE-PLAYS from
# scratch, plus statement-identity against a FROZEN reference the deposit never
# rebuilds. A hostile build can misbehave in the sandbox but cannot forge an
# admission.
#
# Because the token is read-only we CANNOT post a PR comment with the default
# token's write scope — so `pull-requests: write` is granted ONLY to the
# comment step's context via a separate job that does NOT check out or run
# untrusted code. See the `report` job.
name: deposit-gate

on:
  pull_request:
    paths:
      - 'deposits/**'
  # Manual re-gate of every committed deposit dir (available once this file is
  # on the default branch).
  workflow_dispatch: {}

# Job-default permissions: read-only. The untrusted build runs under this.
permissions:
  contents: read

# The one Mathlib environment deposits may pin, and its trusted reference
# (environments.mathlib_reference_sha256, on the exports-v1 release). builder-images.yml
# publishes the image pair for this revision.
env:
  MATHLIB_REV: fabf563a7c95a166b8d7b6efca11c8b4dc9d911f
  MATHLIB_REFERENCE_SHA256: c53c878debde809ec5c83717b3f5a2591197f008d6167141eb1aaa6f11476155

concurrency:
  group: deposit-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # Bound the whole untrusted build+gate job (availability guard on top of the
    # per-build `timeout` inside gate_deposit.sh). A Mathlib deposit adds a ~12 GB
    # image pull and an `import Mathlib` build, hence more than the core path needs.
    timeout-minutes: 60
    # packages: read pulls the Mathlib environment from GHCR. It is read-only, like
    # contents, so the untrusted build still cannot write anything.
    permissions:
      contents: read
      packages: read
    outputs:
      any_failed: ${{ steps.run.outputs.any_failed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Build the gate exe (mirrors verify.yml exactly) ──────────────────
      # lean-action builds backend-gate (Lean-core only, no Mathlib → ~2 min).
      # use-github-cache is OFF for the same reason verify.yml disables it: a
      # stale cached .lake silently runs an OLD binary.
      - name: Build re-derivation gate (mathesis-adjudicate)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: backend-gate
          use-github-cache: false
          test: false
          lint: false

      - name: Build the gate executable
        working-directory: backend-gate
        run: lake build mathesis-adjudicate

      - name: Locate the gate binary
        run: |
          BIN="$GITHUB_WORKSPACE/backend-gate/.lake/build/bin/mathesis-adjudicate"
          test -x "$BIN" || { echo "FATAL: gate exe not built at $BIN"; ls -R backend-gate/.lake/build/bin || true; exit 1; }
          echo "MATHESIS_ADJUDICATE=$BIN" >> "$GITHUB_ENV"

      # The gate exe AND the deposit build both shell out to `lean` for their
      # sysroot. lean-action pins the toolchain per-project; set a global
      # default and export LEAN_SYSROOT so both resolve it from any cwd.
      - name: Configure Lean toolchain (gate exe + deposit build)
        working-directory: backend-gate
        run: |
          elan default "$(tr -d '[:space:]' < lean-toolchain)"
          echo "LEAN_SYSROOT=$(lean --print-prefix)" >> "$GITHUB_ENV"

      # lean4export is a gate pin. It is a require in backend-gate/lakefile.lean,
      # so its exe is built into the same .lake tree; point the gate script at it.
      # `lake build mathesis-adjudicate` builds the Export *library* (the import)
      # but NOT lean4export's *executable*, which the deposit gate needs to export
      # the untrusted submission. Build it explicitly in its package dir, then locate.
      - name: Build + locate lean4export
        run: |
          L4E_PKG="$GITHUB_WORKSPACE/backend-gate/.lake/packages/lean4export"
          test -d "$L4E_PKG" || { echo "FATAL: lean4export package not resolved at $L4E_PKG"; exit 1; }
          # Build lean4export with the SAME pinned toolchain the deposit build +
          # gate exe use — `elan run <tc>` overrides any toolchain lean4export's
          # own package pins, so its binary reads v4.31.0 oleans (else the export
          # step hits "incompatible header" reading the freshly-built Submission.olean).
          TC="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/backend-gate/lean-toolchain")"
          ( cd "$L4E_PKG" && elan run "$TC" lake build ) || { echo "FATAL: lean4export build failed"; exit 1; }
          L4E="$(find "$L4E_PKG/.lake" -type f -name lean4export -perm -u+x 2>/dev/null | head -n1)"
          test -x "$L4E" || { echo "FATAL: lean4export exe not found after build"; find "$L4E_PKG" -name 'lean4export*' -type f || true; exit 1; }
          echo "MATHESIS_LEAN4EXPORT=$L4E" >> "$GITHUB_ENV"

      # ── Which deposits changed in this PR ────────────────────────────────
      # The untrusted build runs inside this image with --network none, one writable mount
      # and no inherited environment. Before this, `landrun` was the intended confinement and
      # nothing installed it, so every build took the bare path: cwd inside the checkout, with
      # write access to the adjudicator binary, init.export, the exports dir and the claim
      # manifests. A build that can rewrite the verifier defeats "trust is in the replay".
      - name: Build the confined deposit builder image
        run: |
          docker build -t mathesis/lean-builder:pinned deploy/builder
          docker run --rm mathesis/lean-builder:pinned lean --version

      - name: Determine changed deposits
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            # dry-run (workflow_dispatch or branch push): gate every committed deposit dir.
            slugs="$(ls -d deposits/*/ 2>/dev/null | sed 's#deposits/##; s#/##' | sort -u)"
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
            # slugs of deposits touched by this PR (added/modified files under deposits/<slug>/).
            slugs="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'deposits/**' \
              | sed -n 's#^deposits/\([^/]*\)/.*#\1#p' | sort -u)"
          fi
          echo "slugs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$slugs" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "gating deposits:"; echo "$slugs"

      # ── Which environment each deposit pins ──────────────────────────────
      # `@mathlib` selects the environment. The parser is the gate's own and only checks
      # grammar; whether the bank HAS that revision is decided here, before anything is pulled
      # or built. One revision is supported today, the one every banked accession pins, and the
      # trusted reference for it is the blob recorded as environments.mathlib_reference_sha256.
      # A header that does not parse is left to the gate, which rejects it with the parser's
      # own message.
      - name: Resolve deposit environments
        id: envs
        env:
          SLUGS: ${{ steps.changed.outputs.slugs }}
          MATHLIB_REV: ${{ env.MATHLIB_REV }}
        run: |
          : > deposit-envs.txt
          need_mathlib=0
          for slug in $SLUGS; do
            f="deposits/$slug/submission.lean"
            [ -f "$f" ] || continue
            rev="$(python3 ci/parse_deposit.py "$f" 2>/dev/null \
                   | python3 -c 'import json,sys;print(json.load(sys.stdin).get("mathlib") or "")' 2>/dev/null)"
            if [ -z "$rev" ]; then env=core
            elif [ "$rev" = "$MATHLIB_REV" ]; then env=mathlib; need_mathlib=1
            else env=unsupported
            fi
            echo "$slug $env" >> deposit-envs.txt
          done
          cat deposit-envs.txt
          echo "need_mathlib=$need_mathlib" >> "$GITHUB_OUTPUT"

      # The pair is published by builder-images.yml, from main, so a fork PR only ever pulls
      # what trusted code built. Pull by tag: the tag names the environment
      # (toolchain + Mathlib revision), and builder-images.yml refuses to push a pair whose
      # exporter does not regenerate the pinned reference byte for byte.
      - name: Pull the Mathlib environment
        if: steps.envs.outputs.need_mathlib == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /usr/share/swift /usr/local/share/boost
          df -h /
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          TAG="v4.31.0-mathlib-${MATHLIB_REV:0:7}"
          B="ghcr.io/$OWNER/mathesis-lean-builder:$TAG"
          E="ghcr.io/$OWNER/mathesis-lean-exporter-rt:$TAG"
          docker pull "$B"
          docker pull "$E"
          docker logout ghcr.io
          echo "MATHLIB_BUILDER_IMAGE=$B" >> "$GITHUB_ENV"
          echo "MATHLIB_EXPORT_IMAGE=$E" >> "$GITHUB_ENV"
          df -h /

      # The Mathlib reference, by content address. fetch_exports.sh verifies the sha256 after
      # download, and gate_deposit.sh refuses an empty reference or one that loads 0 constants.
      - name: Fetch the Mathlib trusted reference
        if: steps.envs.outputs.need_mathlib == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          MATHESIS_EXPORT_STORE: gh:${{ github.repository }}@exports-v1
          MATHESIS_EXPORTS_DIR: ${{ runner.temp }}/mathlib-reference
        run: |
          bash ci/fetch_exports.sh "$MATHLIB_REFERENCE_SHA256"
          f="$MATHESIS_EXPORTS_DIR/$MATHLIB_REFERENCE_SHA256.export"
          test -s "$f" || { echo "FATAL: reference absent after fetch"; exit 1; }
          echo "MATHLIB_REFERENCE=$f" >> "$GITHUB_ENV"

      # ── Run the gate on each changed deposit ─────────────────────────────
      - name: Gate each changed deposit
        id: run
        env:
          # No store secret on fork PRs; if the reference blob is not committed
          # the fetch degrades and a discharge deposit is rejected (fail-closed).
          MATHESIS_EXPORT_STORE: gh:${{ github.repository }}@exports-v1
          MATHESIS_EXPORTS_DIR: ${{ github.workspace }}/registry/_shared/exports
          # Trusted logical-core reference: the gate rejects an untrusted deposit
          # that redefines a trusted constant (fake Iff/Eq/False → derive False).
          # This is the untrusted path, where that attack actually matters.
          MATHESIS_INIT_EXPORT: ${{ github.workspace }}/backend-gate/init.export
          # Confine the untrusted build. GH_TOKEN stays on the STEP because the trusted
          # reference-R fetch needs it; the point is that the build container no longer
          # inherits it, which ci/test_gate_isolation.sh asserts.
          MATHESIS_BUILDER_IMAGE: mathesis/lean-builder:pinned
          # Keep candidate.export and adj.json, which the gate otherwise deletes on exit.
          # adj.json is the only machine-readable verdict: `admit` and `needs-review` are both
          # exit code 0, so a caller cannot tell them apart from the exit status.
          MATHESIS_OUT_DIR: ${{ github.workspace }}/gate-artifacts
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x ci/gate_deposit.sh ci/parse_deposit.py ci/fetch_exports.sh
          : > deposit-report.md
          echo "## Mathesis deposit gate" >> deposit-report.md
          echo "" >> deposit-report.md
          any_failed=0
          slugs='${{ steps.changed.outputs.slugs }}'
          if [ -z "$(printf '%s' "$slugs" | tr -d '[:space:]')" ]; then
            echo "_No deposit directories changed._" >> deposit-report.md
          fi
          for slug in $slugs; do
            [ -d "deposits/$slug" ] || continue
            echo "── gating deposits/$slug ──"
            env_name="$(awk -v s="$slug" '$1==s{print $2}' deposit-envs.txt)"
            # Per-deposit environment. A Mathlib deposit builds and exports in the Mathlib pair
            # and is adjudicated against BOTH trusted references: init.export guards the logical
            # core and the kernel built-ins, mathlib.export the Mathlib vocabulary, and neither
            # covers the other (see gate_deposit.sh, step 4).
            case "$env_name" in
              mathlib)
                dep_builder="$MATHLIB_BUILDER_IMAGE"
                dep_export="$MATHLIB_EXPORT_IMAGE"
                dep_refs="$MATHESIS_INIT_EXPORT:$MATHLIB_REFERENCE" ;;
              unsupported)
                {
                  echo "### Deposit \`$slug\`"
                  echo ""
                  echo "- **block** — \`@mathlib\` names a revision this bank has no environment for."
                  echo "  The supported revision is \`$MATHLIB_REV\`."
                } >> deposit-report.md
                echo "  → BLOCK (unsupported @mathlib)"
                any_failed=1
                echo "" >> deposit-report.md
                continue ;;
              *)
                dep_builder="$MATHESIS_BUILDER_IMAGE"
                dep_export=""
                dep_refs="$MATHESIS_INIT_EXPORT" ;;
            esac
            if MATHESIS_BUILDER_IMAGE="$dep_builder" MATHESIS_EXPORT_IMAGE="$dep_export" \
               MATHESIS_INIT_EXPORT="$dep_refs" \
               bash ci/gate_deposit.sh "deposits/$slug" >> deposit-report.md 2>&1; then
              echo "  → pass (admit/needs-review)"
            else
              rc=$?
              echo "  → FAIL (exit $rc)"
              any_failed=1
            fi
            echo "" >> deposit-report.md
          done
          echo "any_failed=$any_failed" >> "$GITHUB_OUTPUT"
          cat deposit-report.md

      - name: Upload deposit report
        uses: actions/upload-artifact@v4
        with:
          name: deposit-report
          path: deposit-report.md

  # ── Post ONE PR comment with the report. Separate job so the write scope is
  # NEVER in the same context as the untrusted build. It only downloads the
  # report artifact and comments — it never checks out or runs deposit code. ──
  report:
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download deposit report
        uses: actions/download-artifact@v4
        with:
          name: deposit-report
          path: report

      - name: Post / update PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Mathesis deposit gate\n\n_(report artifact missing)_';
            try { body = fs.readFileSync('report/deposit-report.md', 'utf8'); } catch (e) {}
            const marker = '<!-- mathesis-deposit-gate -->';
            body = marker + '\n' + body;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            // Only ever update OUR OWN prior comment: require a Bot author AND the
            // marker as the FIRST line (startsWith, not includes). Otherwise a user
            // could plant a comment containing the marker string and hijack/suppress
            // the gate's verdict comment.
            const existing = comments.find(c =>
              c.user && c.user.type === 'Bot' && c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail the check if any deposit was rejected/blocked
        if: needs.gate.outputs.any_failed == '1'
        run: |
          echo "One or more deposits were rejected or blocked."
          exit 1
